name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg python3-tk libx11-6 libxtst6
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r requirements-correction.txt -r requirements-dev.txt
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Run tests without model downloads or desktop input
        run: python -m unittest discover -s tests -v
      - name: Check source package
        run: python scripts/package_release.py
